services:
  - type: web
    name: toll-system-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: TollSystem
    buildCommand: ./build.sh
    startCommand: gunicorn TollSystem.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: tollsystem-db
          property: connectionString

databases:
  - name: tollsystem-db
    plan: free
    region: oregon
