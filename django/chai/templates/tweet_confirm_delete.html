{% extends "layout.html" %}

{% block title %}
chai aur tweet 
{% endblock %}

{% block content %}

<h1 class="text-center text-white mt-4">Delete Tweet</h1>

<div class="container mt-4 text-white">
  <h2>Are you sure you want to delete this tweet?</h2>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-success" href="{% url 'tweet_list' %}">Cancel</a>
  </form>
</div>

{% endblock %}
