{% extends "layout.html" %}

{% block title %}
chai aur tweet 
{% endblock %}

{% block content %}

<h1 class="text-center text-white mt-4">Welcome to Chai aur Tweet</h1>

<div class="container mt-4 text-white">
  <h2>{% if form.instance.pk %}Edit Tweet{% else %}Create Tweet{% endif %}</h2>
  <form method="post" enctype="multipart/form-data" class="form">
    {% csrf_token %} 
    {{ form.as_p }}
    <button class="btn btn-success" type="submit">Submit</button>
    <a class="btn btn-secondary" href="{% url 'tweet_list' %}">Back to list</a>
  </form>
</div>

{% endblock %}
